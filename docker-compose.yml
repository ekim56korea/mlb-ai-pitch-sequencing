services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/data:/code/data
      - ./backend/scripts:/code/scripts
    # Redis 컨테이너와 연결
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # Python 출력 버퍼링 비활성화 (로그 즉시 출력)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build: ./client
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    # 핫 리로딩을 위해 폴링 방식 사용 (Mac/Windows 호환성)
    command: npm run dev

  # 🚀 Redis (메모리 캐시 저장소)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"